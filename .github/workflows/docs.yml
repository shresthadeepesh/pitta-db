name: Docs

# The site is built here rather than where the extension lives, because Pages
# on a private repository needs a paid plan and a docs site that nobody can
# reach is not documentation. The prose itself is written next to the code and
# synced here on every push to main.
on:
  push:
    branches: [main]
    # What the site is built from is more than its prose: a change to the
    # toolchain that builds it has to rebuild it too.
    paths: ['docs/**', '.github/workflows/docs.yml', 'package.json', 'pnpm-workspace.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '11.0.9' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      # Pages serves this repository from a subpath, so the base has to match
      # the repository name or every asset 404s.
      - run: DOCS_BASE=/pitta-db/ pnpm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/.vitepress/dist }

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
